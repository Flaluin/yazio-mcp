<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ernährungs-Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14171d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ernährung">
<script src="shim.js"></script>
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;--text:#1d2330;--muted:#6b7385;--line:#e4e7ee;
  --kcal:#5b7fd6;--p:#1f9d8b;--f:#e0a030;--c:#7a6ad8;--w:#2f9fd8;--bad:#d4553f;--ok:#2e9e5b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171d;--card:#1e222b;--text:#eceff5;--muted:#9aa3b5;--line:#2c313c;
  --kcal:#7f9cf0;--p:#3cc2ae;--f:#f0b94d;--c:#a193f2;--w:#58b8ea;--bad:#ee7b66;--ok:#55c07f;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#wrap{max-width:760px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:20px;margin:6px 0 2px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.tabs{display:flex;gap:6px;margin:10px 0 12px}
.tabs button{flex:1;font-weight:600;padding:8px 2px;font-size:14px}
.addrow{display:flex;gap:8px;margin-bottom:10px}
input[type=text],select{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input{width:22px;height:22px;accent-color:var(--p);flex:none}
.item .x{margin-left:auto;padding:2px 9px;flex:none}
.item .t{min-width:0;overflow-wrap:anywhere}
.item .t.done{text-decoration:line-through;color:var(--muted)}
.todoform input[type=text],.todoform input[type=datetime-local],.todoform textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-bottom:8px}
.todoform textarea{min-height:60px;resize:vertical}
.remslot{border-left:4px solid var(--line);padding-left:10px;margin:8px 0}
.remslot b{font-size:13px}
.item.todo{align-items:flex-start}
.item.todo input[type=checkbox]{margin-top:2px}
.item.todo .body{min-width:0;flex:1}
.item.todo small{display:block;color:var(--muted);overflow-wrap:anywhere}
.cat{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 2px}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.pager{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pager b{font-size:17px}
.row{margin:10px 0}
.rl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.rl span:last-child{color:var(--muted);text-align:right}
.rl b{color:var(--text)}
.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px}
.chart{position:relative;height:210px}
.chart.tall{height:260px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;accent-color:var(--p)}
.tag{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.mic{padding:8px 0;border-bottom:1px solid var(--line)}
.mic:last-child{border-bottom:0}
.mic small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.ev{padding:10px 12px;border-radius:10px;margin:8px 0;background:var(--bg);border-left:4px solid var(--f)}
.ev.good{border-left-color:var(--ok)}
.ev.bad{border-left-color:var(--bad)}
.ev b{display:block;margin-bottom:2px}
.banner{background:var(--card);border:1px solid var(--bad);color:var(--text);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n{text-align:right;white-space:nowrap}
.grid{display:grid;grid-template-columns:1.6fr repeat(7,1fr);gap:2px;font-size:12px;align-items:center}
.grid div{text-align:center;padding:5px 0}
.grid div:first-child{text-align:left}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--p)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
tr.heute td{background:var(--bg)}
details.card summary{cursor:pointer;font-size:16px}
details.card[open] summary{margin-bottom:8px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div id="wrap">
  <div class="top">
    <div><h1>Ernährungs-Dashboard</h1><div class="sub" id="status">Lade …</div></div>
    <button id="refresh" type="button">Aktualisieren</button>
  </div>
  <div id="banner"></div>
  <div id="app"></div>
</div>

<script>
(function(){
"use strict";

/* ---------- Konfiguration ---------- */
var SERVER = "Yazio Ole";                       // Anzeigename des Yazio-Connectors
var START_DATE = "2026-11-23";                  // Beginn des Zunahme-Plans
var GAIN_PER_MONTH = 2.5;                       // kg pro Monat (Mindestziel)
var START_WEIGHT = 70;                          // Startgewicht am Beginn des Plans
var DEF = {kcal:3400,p:149.3,f:98.7,c:456.1,water:3000,steps:10000,w:70,wt:75};
var goals = Object.assign({}, DEF);

var MICROS = [
  {k:"fiber",     n:"Ballaststoffe", ref:30,   u:"g",  why:"Verdauung, Sättigung, Darmflora"},
  {k:"calcium",   n:"Calcium",       ref:1000, u:"mg", why:"Knochen, Zähne, Muskelkontraktion"},
  {k:"iron",      n:"Eisen",         ref:10,   u:"mg", why:"Sauerstofftransport im Blut"},
  {k:"magnesium", n:"Magnesium",     ref:350,  u:"mg", why:"Muskeln, Nerven, Energiestoffwechsel"},
  {k:"zinc",      n:"Zink",          ref:14,   u:"mg", why:"Eiweißstoffwechsel, Immunsystem, Wundheilung"},
  {k:"potassium", n:"Kalium",        ref:4000, u:"mg", why:"Flüssigkeitshaushalt, Muskeln, Blutdruck"},
  {k:"vitamin_c", n:"Vitamin C",     ref:110,  u:"mg", why:"Immunsystem, Kollagen, Eisenaufnahme"},
  {k:"vitamin_d", n:"Vitamin D",     ref:20,   u:"µg", why:"Knochen, Muskelfunktion, Immunsystem"},
  {k:"vitamin_b12",n:"Vitamin B12",  ref:4,    u:"µg", why:"Blutbildung, Nerven"}
];
var CHECKS = [
  {k:"obst",     l:"Obst"},
  {k:"gemuese",  l:"Gemüse"},
  {k:"algenoel", l:"Algenöl (Omega-3)"},
  {k:"nussmix",  l:"Nussmix & Paranuss"},
  {k:"kreatin",  l:"Kreatin 5 g"},
  {k:"wasser",   l:"Wasser (6 × 500 ml)", water:true},
  {k:"training", l:"Training (Push/Pull/Legs)"}
];
function wdot(n){var h=Math.round(Math.max(0,Math.min(n,6))/6*120);return '<span class="dot" style="background:hsl('+h+',65%,42%);width:22px;height:22px;line-height:22px;color:#fff;font-size:11px;text-align:center">'+n+'</span>'}
function checklistHtml(d,c){
  return CHECKS.map(function(x){
    if(x.water){
      var n=c.wasser||0,boxes="";
      for(var i=1;i<=6;i++) boxes+='<input type="checkbox" data-chk="wasser" data-n="'+i+'" data-iso="'+d.iso+'"'+(i<=n?" checked":"")+'>';
      return '<div class="chk" style="flex-wrap:wrap"><span>'+esc(x.l)+' · '+fmt(n*0.5,1)+' l</span><span class="tag">manuell</span><div style="display:flex;gap:10px;width:100%;margin-top:6px">'+boxes+'</div></div>';
    }
    return '<label class="chk"><input type="checkbox" data-chk="'+x.k+'" data-iso="'+d.iso+'"'+(c[x.k]?" checked":"")+'><span>'+esc(x.l)+'</span><span class="tag">manuell</span></label>';
  }).join("");
}
var WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];

/* ---------- Zustand ---------- */
var days = [];          // 7 Tage, älteste zuerst
var micro = {};         // nutrient -> {iso: Wert in Referenzeinheit}
var sel = 6;
var evOpen = false;
var lists = {todos:[],ideas:[]};
var IDEA_CATS = ["Frühstück","Mittag","Abend","Snack","Sonstiges"];
var sugg = {};
var hasSample = false;
var draft = {t:"",n:"",r:[{at:"",m:""},{at:"",m:""},{at:"",m:""}]};
var LV = ["\uD83D\uDFE2","\uD83D\uDFE1","\uD83D\uDD34"], LVN = ["Grün","Gelb","Rot"];
var lastSig = "";
var wOff = 0, mOff = 0; // 0 = aktuelle Woche / aktueller Monat
var dayCache = {}, monthCache = {};
var busy = false, callRef = null;
var tab = "tag";
var charts = [];
var errCode = null;
var loadedAt = null;

/* ---------- Helfer ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n,d){d=d||0;return Number(n).toLocaleString("de-DE",{maximumFractionDigits:d,minimumFractionDigits:0})}
function isoOf(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day}
function shortDate(iso){var p=iso.split("-");return p[2]+"."+p[1]+"."}
function wdOf(iso){var p=iso.split("-");return WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()]}
function daysSince(iso,from){var a=iso.split("-"),b=from.split("-");return Math.round((new Date(+a[0],+a[1]-1,+a[2])-new Date(+b[0],+b[1]-1,+b[2]))/864e5)}
function txt(r){
  if(!r) return "";
  if(typeof r.payload==="string") return r.payload;
  var t=(r.content||[]).filter(function(b){return b&&b.type==="text"}).map(function(b){return b.text}).join("\n");
  return t;
}
function num(m,i){return m&&m[i]!==undefined?parseFloat(m[i]):0}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function avg(arr,k){var a=arr.filter(function(d){return d.logged});if(!a.length)return null;return a.reduce(function(s,d){return s+d[k]},0)/a.length}
var store=null,checkData={},writeQ={},syncMsg="";
function lsGet(iso){try{return JSON.parse(localStorage.getItem("ep_"+iso)||"{}")}catch(e){return {}}}
function getChecks(iso){return store?(checkData[iso]||{}):lsGet(iso)}
function hasChecks(iso){var c=getChecks(iso);for(var k in c){return true}return false}
function setCheck(iso,k,v){
  var c=Object.assign({},getChecks(iso));c[k]=v;
  if(!store){try{localStorage.setItem("ep_"+iso,JSON.stringify(c))}catch(e){}return}
  checkData[iso]=c;
  var ref=store.doc("checks/"+iso);
  writeQ[iso]=(writeQ[iso]||Promise.resolve()).then(function(){return ref.set(checkData[iso])}).catch(function(){syncMsg="Speichern fehlgeschlagen. Bitte noch einmal versuchen.";setStatus(syncMsg)});
}
function lsLoad(){try{lists.todos=JSON.parse(localStorage.getItem("ep_todos")||"[]");lists.ideas=JSON.parse(localStorage.getItem("ep_ideas")||"[]")}catch(e){}}
function lsSave(){try{localStorage.setItem("ep_todos",JSON.stringify(lists.todos));localStorage.setItem("ep_ideas",JSON.stringify(lists.ideas))}catch(e){}}
function failMsg(){setStatus("Speichern fehlgeschlagen. Bitte noch einmal versuchen.")}
function addItem(name,data){
  data.created=Date.now();
  var temp=Object.assign({id:"tmp"+data.created},data);
  lists[name].push(temp);
  if(store){store.collection(name).add(data).catch(failMsg)}else lsSave();
  render();
}
function updItem(name,id,patch){
  lists[name].forEach(function(x){if(x.id===id)Object.assign(x,patch)});
  if(store){store.doc(name+"/"+id).update(patch).catch(failMsg)}else lsSave();
  render();
}
function delItem(name,id){
  lists[name]=lists[name].filter(function(x){return x.id!==id});
  if(store){store.doc(name+"/"+id).delete().catch(failMsg)}else lsSave();
  render();
}
async function initStore(){
  try{
    store=window.claude&&window.claude.use?await window.claude.use("db"):null;
  }catch(e){store=null}
  if(!store){syncMsg="Haken nur auf diesem Gerät";lsLoad();return}
  var timer=setTimeout(function(){syncMsg="Haken: Synchronisierung nicht erreichbar";setStatus(syncMsg)},10000);
  ["todos","ideas"].forEach(function(name){
    store.collection(name).onSnapshot(function(snap){
      lists[name]=snap.docs.map(function(d){var x=Object.assign({},d.data()||{});x.id=d.id;return x}).sort(function(a,b){return (a.created||0)-(b.created||0)});
      var ae=document.activeElement,typing=ae&&ae.closest&&(ae.closest(".todoform")||(ae.tagName==="INPUT"&&ae.type==="text"&&ae.value));
      if(((tab==="todo"&&name==="todos")||(tab==="ideen"&&name==="ideas"))&&!typing) render();
    },function(){});
  });
  store.collection("checks").onSnapshot(function(snap){
    clearTimeout(timer);
    var next={};
    snap.docs.forEach(function(d){next[d.id]=d.data()||{}});
    var changed=JSON.stringify(next)!==JSON.stringify(checkData);
    checkData=next;
    if(changed&&!document.activeElement.matches("input[type=checkbox]")) render();
  },function(e){
    clearTimeout(timer);
    store=null;syncMsg="Haken nur auf diesem Gerät";lsLoad();render();
  });
}

/* ---------- Parser (Yazio liefert Text) ---------- */
function parseDay(t,iso){
  var d={iso:iso,kcal:0,p:0,f:0,c:0,water:0,waterGoal:goals.water,weight:null,steps:0,meals:{},logged:false};
  var m=t.match(/Eaten:\s*([\d.]+)\s*kcal\s*·\s*P\s*([\d.]+)\s*·\s*F\s*([\d.]+)\s*·\s*C\s*([\d.]+)/);
  if(m){d.kcal=num(m,1);d.p=num(m,2);d.f=num(m,3);d.c=num(m,4)}
  m=t.match(/Water:\s*([\d.]+)\s*\/\s*([\d.]+)\s*ml/);
  if(m){d.water=num(m,1);d.waterGoal=num(m,2)}
  m=t.match(/Weight:\s*([\d.]+)\s*kg/);
  if(m){d.weight=num(m,1)}
  m=t.match(/([\d.]+)\s*steps/);
  if(m){d.steps=num(m,1)}
  m=t.match(/By meal, kcal:\s*(.*)/);
  if(m){var re=/([A-Za-zÄÖÜäöüß_]+)\s+(\d+(?:\.\d+)?)/g,x;while((x=re.exec(m[1]))){d.meals[x[1].toLowerCase()]=parseFloat(x[2])}}
  d.yw=d.water;
  d.logged=d.kcal>0;
  return d;
}
function parseGoals(t){
  var m=t.match(/Calories:\s*([\d.]+)/);if(m)goals.kcal=num(m,1);
  m=t.match(/Protein\s*([\d.]+)\s*g\s*·\s*fat\s*([\d.]+)\s*g\s*·\s*carbs\s*([\d.]+)/i);
  if(m){goals.p=num(m,1);goals.f=num(m,2);goals.c=num(m,3)}
  m=t.match(/Water:\s*([\d.]+)\s*ml/);if(m)goals.water=num(m,1);
  m=t.match(/steps:\s*([\d.]+)/);if(m)goals.steps=num(m,1);
  m=t.match(/Weight:\s*([\d.]+)\s*kg\s*→\s*target\s*([\d.]+)/);if(m){goals.w=num(m,1);goals.wt=num(m,2)}
}
var TOBASE={"g":1,"mg":1e-3,"µg":1e-6,"ug":1e-6,"mcg":1e-6};
function parseNutrient(t,refUnit){
  var out={},re=/^(\d{4}-\d{2}-\d{2})\s+([\d.]+)\s*(\S+)/gm,x;
  while((x=re.exec(t))){
    var v=parseFloat(x[2]),u=x[3],f=(TOBASE[u]||TOBASE[refUnit])/TOBASE[refUnit];
    out[x[1]]=v*f;
  }
  return out;
}

/* ---------- Laden ---------- */
function setStatus(s){$("#status").textContent=s}
function showBanner(code){
  var b=$("#banner"),t="";
  if(!code){b.innerHTML="";return}
  if(code==="server_not_connected"||code==="selection_required"||code==="server_not_found")
    t="Die Yazio-Anmeldung fehlt. Tippe unten auf „Zugang ändern“.";
  else if(code==="needs_reauth")
    t="Die Yazio-Anmeldung hat nicht geklappt. Tippe unten auf „Zugang ändern“ und gib E-Mail und Passwort neu ein.";
  else if(code==="not_in_manifest"||code==="approval_required"||code==="consent_required"||code==="not_granted"||code==="blocked_by_policy")
    t="Der Zugriff auf Yazio ist nicht möglich. Tippe unten auf „Zugang ändern“.";
  else if(code==="unavailable")
    t="Live-Daten sind gerade nicht verfügbar. Die Checkliste und die Ziele funktionieren trotzdem.";
  else
    t="Yazio hat gerade nicht geantwortet ("+esc(code)+"). Tippe auf „Aktualisieren“, um es noch einmal zu versuchen.";
  b.innerHTML='<div class="banner">'+t+'</div>';
}
function emptyDays(){
  var out=[],now=new Date();
  for(var i=6;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);out.push(parseDay("",isoOf(d)))}
  return out;
}
var CKEY="ep_cache_v1";
function saveCache(){
  try{localStorage.setItem(CKEY,JSON.stringify({at:Date.now(),goals:goals,micro:micro,dayCache:dayCache,monthCache:monthCache}))}catch(e){}
}
function restoreCache(){
  try{
    var c=JSON.parse(localStorage.getItem(CKEY)||"null");
    if(!c||!c.dayCache)return false;
    goals=Object.assign({},DEF,c.goals||{});micro=c.micro||{};dayCache=c.dayCache||{};monthCache=c.monthCache||{};
    days=emptyDays().map(function(d){return dayCache[d.iso]||d});
    loadedAt=new Date(c.at);
    var h=loadedAt.getHours(),mi=loadedAt.getMinutes();
    setStatus("Gespeichert · Stand "+(isoOf(loadedAt)===isoAgo(0)?"":shortDate(isoOf(loadedAt))+" ")+(h<10?"0":"")+h+":"+(mi<10?"0":"")+mi+" · zum Abrufen auf Aktualisieren tippen");
    return true;
  }catch(e){return false}
}
async function getCall(){
  if(callRef)return callRef;
  var mcp=null;
  try{if(window.claude&&window.claude.use)mcp=await window.claude.use("mcp")}catch(e){mcp=null}
  if(!mcp)return null;
  var opt={cache:{staleTime:60000,gcTime:300000}};
  callRef=function(tool,input){return mcp.callTool(SERVER,tool,input,opt)};
  return callRef;
}
async function load(){
  setStatus("Lade Yazio-Daten …");
  errCode=null;
  days=emptyDays();
  var mcp=null;
  try{ if(window.claude&&window.claude.use) mcp=await window.claude.use("mcp"); }catch(e){mcp=null}
  if(!mcp){errCode="unavailable";showBanner(errCode);setStatus("Keine Live-Daten");render();return}
  var opt={cache:{staleTime:60000,gcTime:300000}};
  function call(tool,input){return mcp.callTool(SERVER,tool,input,opt)}
  callRef=call;
  var ms=monthStartIso(),first=ms<isoAgo(6)?ms:isoAgo(6),ckey=monthKey(0);
  var cur={data:{},mw:{}};
  monthCache[ckey]=cur;
  var jobs=[];
  jobs.push(call("get_goals",{}).then(function(r){parseGoals(txt(r))}));
  jobs.push(call("get_daily_summary",{start_date:ms,end_date:isoAgo(0)}).then(function(r){cur.data=parseRange(txt(r))}));
  for(var s=ms;s<isoAgo(6);s=addDays(s,7)){
    (function(iso){
      jobs.push(call("get_daily_summary",{date:iso}).then(function(r){var d=parseDay(txt(r),iso);if(d.weight)cur.mw[iso]=d.weight}));
    })(s);
  }
  var dayJobs=days.map(function(d,i){
    return call("get_daily_summary",{date:d.iso}).then(function(r){days[i]=parseDay(txt(r),d.iso)});
  });
  var micJobs=MICROS.map(function(m){
    return call("get_nutrient_history",{nutrient:m.k,start_date:first}).then(function(r){micro[m.k]=parseNutrient(txt(r),m.u)});
  });
  var all=jobs.concat(dayJobs,micJobs);
  var res=await Promise.allSettled(all);
  var bad=res.filter(function(r){return r.status==="rejected"});
  if(bad.length){errCode=(bad[0].reason&&bad[0].reason.code)||"upstream_error"}
  if(bad.length===res.length){showBanner(errCode)}
  else if(bad.length){showBanner(null);setStatus("Teilweise geladen ("+bad.length+" von "+res.length+" Abfragen fehlgeschlagen)")}
  else showBanner(null);
  days.forEach(function(d){if(d.waterGoal===undefined)d.waterGoal=goals.water;dayCache[d.iso]=d});

    var h=loadedAt.getHours(),mi=loadedAt.getMinutes();

function dayEval(day,isToday){

  if(kg>250) items.push({c:"bad",o:2,t:"Kalorien: "+fmt(kg)+" kcal fehlen",d:"Kalorienreich und einfach: 50 g Nussmix (≈ 300 kcal), 500 ml Vollmilch (≈ 330 kcal, 17 g Eiweiß) oder eine Banane mit Haferflocken."});
  else if(kg<-300) items.push({c:"",o:6,t:"Kalorien: "+fmt(-kg)+" kcal über Ziel",d:"Beim Bulk ist das okay, solange das Gewicht im Plan bleibt."});

  if(day.c<g.c*0.85&&kg>250) items.push({c:"",o:3,t:"Kohlenhydrate: "+fmt(g.c-day.c)+" g fehlen",d:"Reis, Nudeln, Kartoffeln, Haferflocken oder Obst füllen das am schnellsten auf."});
  if(day.water<day.waterGoal*0.9) items.push({c:"bad",o:2,t:"Wasser: "+fmt((day.waterGoal-day.water)/1000,1)+" l fehlen",d:"Das sind etwa "+Math.ceil((day.waterGoal-day.water)/750)+" Flasche(n) à 0,75 l."});

  else items.push({c:"good",o:9,t:"Alle täglichen Säulen abgehakt",d:"Supplemente, Nussmix, Obst und Gemüse sind erledigt."});
  items.sort(function(a,b){return a.o-b.o});

}
function weekEval(W){

  var ak=avg(done,"kcal"),ap=avg(done,"p"),ac=avg(done,"c"),af=avg(done,"f");
  out.push({c:ak>=g.kcal*0.95?"good":"bad",o:1,t:"Kalorien Ø "+fmt(ak)+" von "+fmt(g.kcal),d:ak>=g.kcal*0.95?"Du liegst im Plan.":"Im Schnitt fehlen "+fmt(g.kcal-ak)+" kcal pro Tag. Das bremst die Zunahme. Ein fester Zusatz-Snack (z. B. Nussmix mit Milch) schließt die Lücke."});
  var pd=done.filter(function(d){return d.p>=140}).length;

  var low=done.slice().sort(function(a,b){return a.kcal-b.kcal})[0];

  var we=done.filter(function(d){var w=wdOf(d.iso);return w==="Sa"||w==="So"}),wk=done.filter(function(d){var w=wdOf(d.iso);return w!=="Sa"&&w!=="So"});
  if(we.length&&wk.length){var a=avg(we,"kcal"),b=avg(wk,"kcal");if(a<b-400)out.push({c:"",o:4,t:"Wochenende ≈ "+fmt(b-a)+" kcal niedriger als Werktage",d:"Auch am Wochenende feste Essenszeiten und Zwischenmahlzeiten einplanen."})}
  var wd=done.filter(function(d){return d.water>=d.waterGoal*0.9}).length;
  out.push({c:wd===done.length?"good":"bad",o:wd===done.length?9:3,t:"Wasserziel an "+wd+" von "+done.length+" Tagen erreicht",d:wd===done.length?"":"Trink die erste Flasche direkt morgens. Das ist die einfachste Stellschraube."});
  var fibs=done.map(function(d){return mval("fiber",d.iso)}).filter(function(v){return v!==null&&v>0});
  if(fibs.length){var af2=fibs.reduce(function(s,v){return s+v},0)/fibs.length;if(af2<25)out.push({c:"",o:5,t:"Ballaststoffe Ø "+fmt(af2,1)+" g",d:"Mehr Äpfel, Haferflocken und Brokkoli. Bei so vielen Kalorien verträgt der Darm die Steigerung am besten langsam."})}
  var train=0,sup=[];
  W.forEach(function(d){var c=getChecks(d.iso);if(c.training)train++});
  if(train<4) out.push({c:"",o:6,t:"Training: "+train+" Einheit(en) abgehakt",d:"Ziel sind 4 bis 6 pro Woche. Hake sie täglich in der Checkliste ab, dann stimmt die Zahl."});
  var ws=W.filter(function(d){return d.weight});
  if(ws.length>=2){
    var dx=daysSince(ws[ws.length-1].iso,ws[0].iso),dw=ws[ws.length-1].weight-ws[0].weight;
    if(dx>0){var perWeek=dw/dx*7,goalW=GAIN_PER_MONTH/30*7;
      out.push({c:perWeek>=goalW*0.8?"good":"bad",o:2,t:"Gewichtstrend: "+(perWeek>=0?"+":"")+fmt(perWeek,2)+" kg pro Woche",d:"Ziel: mindestens +"+fmt(goalW,2)+" kg pro Woche. "+(perWeek>=goalW*0.8?"Passt.":"Wenn das zwei Wochen so bleibt, erhöhe die Kalorien um 200–300 kcal.")})}
  }
  out.sort(function(a,b){return a.o-b.o});
  return out;
}

async function ensureWeek(off){

  var t=isoAgo(0),isos=weekIsos(off).filter(function(iso){return iso<=t&&iso>=START_DATE&&!dayCache[iso]});
  if(!isos.length) return;
  busy=true;render();
  if(!(await getCall())){busy=false;render();return}
  await Promise.allSettled(isos.map(function(iso){
    return callRef("get_daily_summary",{date:iso}).then(function(r){dayCache[iso]=parseDay(txt(r),iso)});
  }));
  await fetchMicros(isos[0],isos[isos.length-1]);

async function ensureMonth(off){
  if(off===0) return;
  var key=monthKey(off);if(monthCache[key]) return;
  var all=monthAll(off),t=isoAgo(0),start=all[0]>=START_DATE?all[0]:START_DATE,end=all[all.length-1]<t?all[all.length-1]:t;
  if(start>end) return;
  busy=true;render();
  if(!(await getCall())){busy=false;render();return}
  var st={data:{},mw:{}};
  var jobs=[callRef("get_daily_summary",{start_date:start,end_date:end}).then(function(r){st.data=parseRange(txt(r))})];
  for(var s=start;s<=end;s=addDays(s,7)){
    (function(iso){jobs.push(callRef("get_daily_summary",{date:iso}).then(function(r){var d=parseDay(txt(r),iso);if(d.weight)st.mw[iso]=d.weight}))})(s);
  }
  var res=await Promise.allSettled(jobs);

}
function monthEval(w,done,off){

    return {l:x.water?"Wasser (6/6)":x.l,c:c};
  }).sort(function(a,b){return a.c-b.c});

  if(tr<need) out.push({c:"",o:3,t:"Training: "+tr+" Einheiten in "+n+" Tagen",d:"Bei 4 bis 6 pro Woche wären das mindestens "+need+"."});
  var wt=monthWeights(w,off),pts=[];
  wt.forEach(function(v,i){if(v)pts.push({i:i,v:v})});
  if(pts.length>=2){
    var a=pts[0],b=pts[pts.length-1],dx=b.i-a.i;

      out.push({c:pw>=gw*0.8?"good":"bad",o:1,t:"Gewichtstrend: "+(pw>=0?"+":"")+fmt(pw,2)+" kg pro Woche",d:"Ziel: mindestens +"+fmt(gw,2)+" kg pro Woche. "+(pw>=gw*0.8?"Passt.":"Wenn das so bleibt, erhöhe die Kalorien um 200–300 kcal.")})}

    ["Kohlenhydrate",fmt(g.c,1)+" g","Yazio"],
    ["Wasser",fmt(g.water/1000,1)+" l (6 Kästchen à 500 ml)","Yazio und manuell"],
    ["Gewicht",fmt(g.w)+" kg → "+fmt(g.wt)+" kg, mindestens +"+fmt(GAIN_PER_MONTH,1)+" kg pro Monat","Yazio / Zielkurve"],
    ["Kreatin","5 g täglich","manuell"],
    ["Omega-3","Algenöl täglich","manuell"],
    ["Nussmix & Paranuss","täglich der immer gleiche, günstige Nussmix ohne Paranüsse, dazu eine einzelne Paranuss","manuell"],
    ["Obst","ca. 300 g pro Tag, wechselnde Kombinationen am Frühstück, Banane beim Training (Plan unten)","manuell"],
    ["Gemüse","400 g pro Tag, wechselnde Kombinationen am Mittag, dazu Rohkost (Plan unten)","manuell"],
    ["Training","Push/Pull/Legs, 4 bis 6 Einheiten pro Woche","manuell"]
  ];
  var h='<div class="card"><h2>Alle Ziele</h2><table><tr><th>Ziel</th><th>Wert</th><th>Quelle</th></tr>'
    +rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'}).join("")+'</table></div>'+planFolds();
  h+='<div class="card"><h2>Mikronährstoff-Richtwerte</h2><table><tr><th>Nährstoff</th><th>Richtwert</th><th>Wofür</th></tr>'
    +MICROS.map(function(m){return '<tr><td>'+esc(m.n)+'</td><td class="n">'+fmt(m.ref)+' '+m.u+'</td><td>'+esc(m.why)+'</td></tr>'}).join("")
    +'</table><div class="note">Grobe Referenzwerte (DGE, Erwachsene). Beim Bulk mit 3.400 kcal kommen viele davon automatisch mit.</div></div>';
  return h;
}

/* ---------- Charts ---------- */
function drawDay(){
  var d=days[sel],g=goals,gk=macroKcal(g),dk=macroKcal(d);
  mk("cMacro",{type:"doughnut",data:{labels:["Protein","Fett","Kohlenhydrate"],datasets:[
    {label:"Ist (kcal)",data:[dk.p,dk.f,dk.c],backgroundColor:[css("--p"),css("--f"),css("--c")],borderWidth:0},
    {label:"Ziel (kcal)",data:[gk.p,gk.f,gk.c],backgroundColor:[css("--p"),css("--f"),css("--c")],borderWidth:0}]},
    options:{cutout:"35%",plugins:{legend:{display:false}}}});
  var mk2=Object.keys(d.meals);
  if(mk2.length){
    var names={breakfast:"Frühstück",lunch:"Mittag",dinner:"Abend",snack:"Snacks",snacks:"Snacks"};
    mk("cMeals",{type:"bar",data:{labels:mk2.map(function(k){return names[k]||k}),datasets:[{label:"kcal",data:mk2.map(function(k){return d.meals[k]}),backgroundColor:css("--kcal"),borderRadius:6}]},
      options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,grid:{color:css("--line")}},y:{grid:{display:false}}}}});
  }
}
function drawWeek(){
  var W=weekDays(wOff),g=goals,labels=W.map(function(d){return wdOf(d.iso)+" "+shortDate(d.iso)});
  var grid={color:css("--line")};
  function barLine(id,key,goalVal,color,scale,unit){
    mk(id,{type:"bar",data:{labels:labels,datasets:[
      {type:"bar",label:unit,data:W.map(function(d){return d[key]*scale}),backgroundColor:color,borderRadius:6,order:2},
      {type:"line",label:"Ziel",data:W.map(function(d){return typeof goalVal==="function"?goalVal(d):goalVal}),borderColor:css("--text"),borderDash:[6,4],pointRadius:0,borderWidth:2,order:1}]},
      options:{plugins:{legend:{display:true,labels:{boxWidth:12}}},scales:{y:{beginAtZero:true,grid:grid},x:{grid:{display:false}}}}});
  }
  barLine("wKcal","kcal",g.kcal,css("--kcal"),1,"kcal");
  barLine("wProt","p",g.p,css("--p"),1,"g Protein");
  barLine("wWater","water",function(d){return (d.waterGoal||g.water)/1000},css("--w"),0.001,"l Wasser");
  var base=START_WEIGHT,wt=W.map(function(d){return d.weight||null});
  var target=W.map(function(d){var n=daysSince(d.iso,START_DATE);return n<0?null:base+GAIN_PER_MONTH/30*n});
  var vals=wt.concat(target).filter(function(v){return v!==null});
  var mn=vals.length?Math.floor(Math.min.apply(null,vals)-1):65,mx=vals.length?Math.ceil(Math.max.apply(null,vals)+1):75;
  mk("wWeight",{type:"line",data:{labels:labels,datasets:[
    {label:"Gewicht (kg)",data:wt,borderColor:css("--p"),backgroundColor:css("--p"),pointRadius:4,borderWidth:2,spanGaps:true},
    {label:"Zielkurve",data:target,borderColor:css("--text"),borderDash:[6,4],pointRadius:0,borderWidth:2}]},
    options:{scales:{y:{min:mn,max:mx,grid:grid},x:{grid:{display:false}}}}});
  var done=weekDone(W);
  if(done.length){
    var a={p:avg(done,"p"),f:avg(done,"f"),c:avg(done,"c")},ak=macroKcal(a),gk=macroKcal(g);
    function pc(o){var t=o.p+o.f+o.c||1;return [o.p/t*100,o.f/t*100,o.c/t*100]}
    var pg2=pc(gk),pa2=pc(ak);
    mk("wMacro",{type:"bar",data:{labels:["Ziel","Ø Woche"],datasets:[
      {label:"Protein",data:[pg2[0],pa2[0]],backgroundColor:css("--p")},
      {label:"Fett",data:[pg2[1],pa2[1]],backgroundColor:css("--f")},
      {label:"Kohlenhydrate",data:[pg2[2],pa2[2]],backgroundColor:css("--c")}]},
      options:{indexAxis:"y",plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.dataset.label+": "+Math.round(c.parsed.x)+" %"}}}},
        scales:{x:{stacked:true,max:100,grid:{display:false},ticks:{callback:function(v){return v+" %"}}},y:{stacked:true,grid:{display:false}}}}});
  }
  var mv=MICROS.map(function(m){
    var vs=done.map(function(d){return mval(m.k,d.iso)}).filter(function(v){return v!==null&&v>0});
    return vs.length?vs.reduce(function(s,v){return s+v},0)/vs.length/m.ref*100:0;
  });
  mk("wMicro",{type:"bar",data:{labels:MICROS.map(function(m){return m.n}),datasets:[{label:"% vom Richtwert",data:mv,backgroundColor:mv.map(function(v){return v>=80?css("--ok"):v>=50?css("--f"):css("--bad")}),borderRadius:6}]},
    options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,suggestedMax:120,grid:grid},y:{grid:{display:false}}}}});
}

function render(){
  destroyCharts();
  function wf(d){d.water=Math.max(d.yw||0,500*((getChecks(d.iso).wasser)||0))}
  days.forEach(wf);Object.keys(dayCache).forEach(function(k){wf(dayCache[k])});
  lastSig=remSig();
  $("#app").innerHTML=tabsHtml()+dueBanner()+(tab==="tag"?tagHtml():tab==="woche"?wocheHtml():tab==="monat"?monatHtml():tab==="todo"?todoHtml():tab==="ideen"?ideenHtml():zieleHtml());
  if(typeof Chart==="undefined") return;
  if(tab==="tag") drawDay(); else if(tab==="woche") drawWeek(); else if(tab==="monat") drawMonth();
}

/* ---------- Ereignisse ---------- */
$("#app").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render()}
  else if(b.dataset.nav){var n=sel+parseInt(b.dataset.nav,10);if(n>=0&&n<days.length){sel=n;render()}}
  else if(b.dataset.suggest){runSuggest()}
  else if(b.dataset.push){
    var act=b.dataset.push,P=window.epPush;if(!P)return;pushMsg="";
    if(act==="on")P.enable().then(function(s){pushSt=s;render()}).catch(function(e){pushMsg="Das hat nicht geklappt: "+(e&&e.message||"Fehler");render()});
    else if(act==="off")P.disable().then(function(s){pushSt=s;render()}).catch(function(){render()});
    else if(act==="test")P.test().then(function(r){pushMsg=r&&r.ok?"Test gesendet. Er sollte gleich ankommen.":"Der Test konnte nicht zugestellt werden.";render()}).catch(function(e){pushMsg=(e&&e.message)||"Fehler";render()});
    render();
  }
  else if(b.dataset.add){
    var nm=b.dataset.add;
    if(nm==="todos"){
      var tt=(draft.t||"").trim();
      if(tt){
        var data0={text:tt.slice(0,120),done:false};
        if((draft.n||"").trim())data0.note=draft.n.trim().slice(0,500);
        var rem=[];draft.r.forEach(function(r,i){if(!isNaN(parseAt(r.at)))rem[i]={at:r.at,m:(r.m||"").trim().slice(0,120)}});
        var rr=rem.filter(Boolean).length?draft.r.map(function(r,i){return rem[i]||{at:"",m:""}}):[];
        if(rr.length)data0.rem=rr;
        draft={t:"",n:"",r:[{at:"",m:""},{at:"",m:""},{at:"",m:""}]};
        addItem("todos",data0);
      }
      return;
    }
    var inp=document.getElementById("inIdea"),v=inp?(inp.value||"").trim():"";
    if(v){var data={text:v.slice(0,200)};if(nm==="todos")data.done=false;else{var sel2=document.getElementById("inIdeaCat");data.cat=sel2?sel2.value:"Sonstiges"}inp.value="";addItem(nm,data)}
  }
  else if(b.dataset.del){var k=b.dataset.del,i=k.indexOf(":");delItem(k.slice(0,i),k.slice(i+1))}
  else if(b.dataset.clear){lists.todos.filter(function(x){return x.done}).forEach(function(x){delItem("todos",x.id)})}
  else if(b.dataset.wnav){var w=wOff-parseInt(b.dataset.wnav,10);if(w>=0){wOff=w;render();ensureWeek(w)}}
  else if(b.dataset.mnav){var m=mOff-parseInt(b.dataset.mnav,10);if(m>=0){mOff=m;render();ensureMonth(m)}}
});
$("#app").addEventListener("change",function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.todo){updItem("todos",t.dataset.todo,{done:t.checked});return}
  if(t&&t.dataset&&t.dataset.chk){
    if(t.dataset.chk==="wasser"){var n=parseInt(t.dataset.n,10);setCheck(t.dataset.iso,"wasser",t.checked?n:n-1)}
    else setCheck(t.dataset.iso,t.dataset.chk,t.checked);
    render();
  }
});
$("#app").addEventListener("input",function(e){
  var t=e.target;if(!t)return;
  if(t.id==="inWish")sugg.wish=t.value;
  var k=t.dataset&&t.dataset.d;if(!k)return;
  if(k==="t")draft.t=t.value;else if(k==="n")draft.n=t.value;
  else{var p=k.split(":"),i=parseInt(p[1],10);if(draft.r[i])draft.r[i][p[0]]=t.value}
});
$("#app").addEventListener("keydown",function(e){
  var t=e.target;
  if(e.key==="Enter"&&t&&t.dataset&&t.dataset.addinput){var b=document.querySelector('[data-add="'+t.dataset.addinput+'"]');if(b)b.click()}
});
$("#app").addEventListener("toggle",function(e){if(e.target&&e.target.matches&&e.target.id==="evd")evOpen=e.target.open},true);
$("#refresh").addEventListener("click",function(){load()});

function fired(){try{return JSON.parse(localStorage.getItem("ep_fired")||"{}")}catch(e){return{}}}
function tick(){
  var f=fired(),now=Date.now(),ch=false;
  lists.todos.forEach(function(x){
    if(x.done||!Array.isArray(x.rem))return;
    x.rem.forEach(function(r,i){
      var t=parseAt(r&&r.at),key=x.id+"#"+i+"#"+r.at;
      if(isNaN(t)||t>now||f[key])return;
      f[key]=1;ch=true;
    });
  });
  if(ch){try{localStorage.setItem("ep_fired",JSON.stringify(f))}catch(e){}}
  if(remSig()!==lastSig){var ae=document.activeElement;if(!(ae&&ae.closest&&ae.closest(".todoform")))render()}
}
setInterval(tick,30000);
days=emptyDays();
render();
initStore().then(function(){render()});
try{if(window.epPush)window.epPush.status().then(function(s){pushSt=s;if(tab==="todo")render()})}catch(e){}
try{window.claude.use("sample").then(function(x){if(x){hasSample=true;render()}})}catch(e){}
if(restoreCache())render();else load();
})();
</script>
</body>
</html>
